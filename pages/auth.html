<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KryyMovie — Authentication</title>
    <meta name="description" content="Login atau Register ke KryyMovie" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="styles/auth.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="auth-header">
      <div class="auth-header-container">
        <a href="../index.html" class="auth-logo">
          <span class="logo-accent">Kryy</span>Movie
        </a>
        <a href="../index.html" class="back-to-home" title="Kembali ke Home">
          ← Kembali
        </a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="auth-container">
      <div class="auth-card">
        <!-- Tab Navigation -->
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Login</button>
          <button class="auth-tab" data-tab="register">Register</button>
        </div>

        <!-- Login Form -->
        <form class="auth-form active" id="login-form" data-form="login">
          <h2 class="auth-form-title">Masuk ke Akun Anda</h2>

          <!-- Error Alert -->
          <div
            class="auth-error-alert"
            id="login-error"
            style="display: none"
          ></div>

          <!-- Email Input -->
          <div class="form-group">
            <label for="login-email" class="form-label">Email</label>
            <input
              type="email"
              id="login-email"
              class="form-input"
              placeholder="nama@email.com"
              required
            />
          </div>

          <!-- Password Input -->
          <div class="form-group">
            <label for="login-password" class="form-label">Password</label>
            <div class="password-input-wrapper">
              <input
                type="password"
                id="login-password"
                class="form-input"
                placeholder="••••••"
                required
              />
              <button
                type="button"
                class="toggle-password-btn"
                data-target="login-password"
                title="Tampilkan/sembunyikan password"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="form-row">
            <label class="checkbox-label">
              <input type="checkbox" class="checkbox-input" />
              <span>Ingat saya</span>
            </label>
            <a href="#" class="forgot-password-link">Lupa password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-submit" id="login-btn">
            <span class="btn-text">Login</span>
            <svg
              class="btn-spinner"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10"></circle>
            </svg>
          </button>

          <!-- Divider -->
          <div class="auth-divider">
            <span>atau</span>
          </div>

          <!-- Social Login (Future) -->
          <p class="auth-social-text">
            Login dengan media sosial akan segera hadir
          </p>

          <!-- Toggle to Register -->
          <p class="auth-toggle-text">
            Belum punya akun?
            <button
              type="button"
              class="auth-toggle-btn"
              data-switch-to="register"
            >
              Daftar di sini
            </button>
          </p>
        </form>

        <!-- Register Form -->
        <form class="auth-form" id="register-form" data-form="register">
          <h2 class="auth-form-title">Buat Akun Baru</h2>

          <!-- Error Alert -->
          <div
            class="auth-error-alert"
            id="register-error"
            style="display: none"
          ></div>

          <!-- Username Input -->
          <div class="form-group">
            <label for="register-username" class="form-label">Username</label>
            <input
              type="text"
              id="register-username"
              class="form-input"
              placeholder="Nama pengguna (min. 3 karakter)"
              required
            />
            <small class="form-hint"
              >3-20 karakter, hanya huruf, angka, dan underscore</small
            >
          </div>

          <!-- Email Input -->
          <div class="form-group">
            <label for="register-email" class="form-label">Email</label>
            <input
              type="email"
              id="register-email"
              class="form-input"
              placeholder="nama@email.com"
              required
            />
          </div>

          <!-- Password Input -->
          <div class="form-group">
            <label for="register-password" class="form-label">Password</label>
            <div class="password-input-wrapper">
              <input
                type="password"
                id="register-password"
                class="form-input"
                placeholder="••••••"
                required
              />
              <button
                type="button"
                class="toggle-password-btn"
                data-target="register-password"
                title="Tampilkan/sembunyikan password"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>

            <!-- Password Strength Meter -->
            <div class="password-strength-meter">
              <div class="strength-bar" id="strength-bar"></div>
            </div>
            <small class="password-strength-text" id="strength-text"></small>
          </div>

          <!-- Confirm Password Input -->
          <div class="form-group">
            <label for="register-confirm" class="form-label"
              >Konfirmasi Password</label
            >
            <div class="password-input-wrapper">
              <input
                type="password"
                id="register-confirm"
                class="form-input"
                placeholder="••••••"
                required
              />
              <button
                type="button"
                class="toggle-password-btn"
                data-target="register-confirm"
                title="Tampilkan/sembunyikan password"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Terms & Conditions -->
          <label class="checkbox-label">
            <input
              type="checkbox"
              class="checkbox-input"
              id="terms-agree"
              required
            />
            <span
              >Saya setuju dengan
              <a href="#" class="link">Syarat & Ketentuan</a></span
            >
          </label>

          <!-- Submit Button -->
          <button type="submit" class="btn-submit" id="register-btn">
            <span class="btn-text">Daftar</span>
            <svg
              class="btn-spinner"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10"></circle>
            </svg>
          </button>

          <!-- Toggle to Login -->
          <p class="auth-toggle-text">
            Sudah punya akun?
            <button
              type="button"
              class="auth-toggle-btn"
              data-switch-to="login"
            >
              Login di sini
            </button>
          </p>
        </form>
      </div>
    </main>

    <!-- Loading Overlay -->
    <div class="auth-loading-overlay" id="auth-loading">
      <div class="loading-content">
        <div class="loading-spinner"></div>
        <p class="loading-text" id="loading-text">Memproses...</p>
      </div>
    </div>

    <!-- Footer -->
    <footer class="auth-footer">
      <p>
        &copy; 2026 <span class="logo-accent">Kryy</span>Movie. Created for Web
        Programming Course Project.
      </p>
    </footer>

    <!-- Scripts -->
    <script type="module" src="../js/firebase/firebase-init.js"></script>
    <script type="module" src="./scripts/auth-page.js"></script>
  </body>
</html>
