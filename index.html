<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KryyMovie — Discover and Track Your Favorite Movies</title>
    <meta
      name="description"
      content="Explore popular movies, search titles, filter by genre, write reviews, and maintain your personal watchlist. Powered by TMDB API."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header / Nav Bar -->
    <header class="app-header">
      <div class="header-container">
        <a href="#/" class="logo">
          <span class="logo-accent">Kryy</span>Movie
        </a>

        <nav class="nav-links">
          <a href="#/" class="nav-link active" id="nav-home">
            <svg
              class="nav-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            Home
          </a>
          <a href="#/watchlist" class="nav-link" id="nav-watchlist">
            <svg
              class="nav-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"
              ></path>
            </svg>
            Watchlist
          </a>
          <div class="nav-spacer"></div>
          <div class="user-info" id="user-info" style="display: none">
            <span id="username-display"></span>
          </div>
          <a
            href="pages/profile.html"
            class="nav-link"
            id="nav-profile"
            style="display: none"
          >
            <svg
              class="nav-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Profile
          </a>
          <button
            id="nav-logout"
            class="nav-link nav-logout-btn"
            style="display: none"
          >
            <svg
              class="nav-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Logout
          </button>
          <a href="pages/auth.html" class="nav-link" id="nav-login">
            <svg
              class="nav-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            Login
          </a>
        </nav>
      </div>
    </header>

    <!-- Notification Banner (For API errors or success messages) -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Dynamic Content Area -->
    <main id="app-content">
      <!-- Rendered Dynamically by UI Module -->
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-container">
        <p>
          &copy; 2026 <span class="logo-accent">Kryy</span>Movie. Created for
          Web Programming Course Project.
        </p>
        <p class="tmdb-attribution">
          This product uses the TMDB API but is not endorsed or certified by
          TMDB.
        </p>
      </div>
    </footer>

    <!-- Scripts in execution order -->
    <script src="config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <!-- Firebase modules (must be imported before main.js) -->
    <script type="module" src="js/firebase/firebase-init.js"></script>
    <script type="module" src="js/firebase/auth.js"></script>
    <script type="module" src="js/firebase/firestore.js"></script>
    <script type="module" src="js/firebase/user.js"></script>
    <!-- Main app orchestrator -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
