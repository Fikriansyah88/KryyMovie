<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KryyMovie — Discover and Track Your Favorite Movies</title>
    <meta
      name="description"
      content="Explore popular movies, search titles, filter by genre, write reviews, and maintain your personal watchlist. Powered by TMDB API."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header / Nav Bar -->
    <header class="app-header">
      <div class="header-container">
        <a href="#/" class="logo">
          <span class="logo-accent">Kryy</span>Movie
        </a>

        <nav class="nav-links">
          <a href="#/" class="nav-link active" id="nav-home">
            <svg
              class="nav-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            Home
          </a>
          <a href="#/watchlist" class="nav-link" id="nav-watchlist">
            <svg
              class="nav-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"
              ></path>
            </svg>
            Watchlist
          </a>
        </nav>
      </div>
    </header>

    <!-- Notification Banner (For API errors or success messages) -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Dynamic Content Area -->
    <main id="app-content">
      <!-- Rendered Dynamically by UI Module -->
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-container">
        <p>
          &copy; 2026 <span class="logo-accent">Kryy</span>Movie. Created for
          Web Programming Course Project.
        </p>
        <p class="tmdb-attribution">
          This product uses the TMDB API but is not endorsed or certified by
          TMDB.
        </p>
      </div>
    </footer>

    <!-- Scripts in execution order -->
    <script src="config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
